# Netlify Deployment Configuration for Utopia Fitness
[build]
  publish = "."
  command = "echo 'Utopia Fitness static bundle ready for Netlify CDN'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600, must-revalidate"
