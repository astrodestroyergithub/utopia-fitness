<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Carbon Gradient -->
    <linearGradient id="utopiaBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Outer Border Neon Accent Gradient (Lime -> Cyan -> Strava Orange) -->
    <linearGradient id="utopiaBorder" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FC4C02" />
    </linearGradient>

    <!-- Dynamic U-Track & Telemetry Gradient -->
    <linearGradient id="utopiaTrack" x1="14" y1="14" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFF00" />
      <stop offset="55%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FC4C02" />
    </linearGradient>

    <!-- Subtle Glow Filter for High-Contrast Visibility -->
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#CCFF00" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Squircle Badge Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#utopiaBg)" stroke="url(#utopiaBorder)" stroke-width="2.5" />

  <!-- Bold Geometric "U" Stadium Track Silhouette -->
  <path
    d="M17 16V33C17 41.2843 23.7157 48 32 48C40.2843 48 47 41.2843 47 33V16"
    stroke="url(#utopiaTrack)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Integrated Biometric Heartbeat / Apex Lightning Pulse Cutting Across the Center -->
  <path
    d="M12 31H23L27.5 21L33.5 39L38.5 27L42 31H52"
    stroke="#CCFF00"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- GPS Summit Beacon Dot at Top Right -->
  <circle cx="47" cy="16" r="4" fill="#FC4C02" stroke="#090D16" stroke-width="1.5" />
</svg>